[package]
name = "ink-engine"
version = "0.1.0"
edition = "2021"
description = "inkwell's parser for the reMarkable .rm v6 (lines) format"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
