<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    width: 300px;
    margin: 0;
    padding: 18px;
    background: #faf7f0;
    color: #211d16;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .brand { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .brand img { width: 22px; height: 22px; }
  .brand span { font-size: 15px; font-weight: 600; letter-spacing: 0.02em; }
  #title {
    font-size: 13px;
    color: #6f6a5e;
    line-height: 1.4;
    margin-bottom: 14px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  #send {
    width: 100%;
    border: 0;
    border-radius: 999px;
    padding: 11px 0;
    background: #211d16;
    color: #faf7f0;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  #send:disabled { opacity: 0.4; cursor: default; }
  #status { margin-top: 10px; font-size: 12px; line-height: 1.5; color: #6f6a5e; }
  #status.ok { color: #2c4655; }
  #status.err { color: #a8552e; }
  .foot { margin-top: 12px; font-size: 10.5px; color: #b5afa1; }
</style>
</head>
<body>
  <div class="brand">
    <img src="icons/icon48.png" alt="">
    <span>inkwell</span>
  </div>
  <div id="title">…</div>
  <button id="send">send this page to reMarkable</button>
  <div id="status"></div>
  <div class="foot">lands in the inkwell inbox folder, typeset for e-ink</div>
  <script src="popup.js"></script>
</body>
</html>
